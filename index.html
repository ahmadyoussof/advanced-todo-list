<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Productivity</p>
          <h1>My Tasks</h1>
        </div>

        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
          🌙 Dark Mode
        </button>
      </header>

      <section class="stats">
        <div class="stat-card">
          <span>Total</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Completed</span>
          <strong id="completedCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Pending</span>
          <strong id="pendingCount">0</strong>
        </div>
      </section>

      <section class="task-form">
        <input
          id="taskInput"
          type="text"
          placeholder="What do you want to do?"
          maxlength="120"
        />

        <div class="form-row">
          <select id="categorySelect">
            <option value="General">General</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Personal">Personal</option>
            <option value="Health">Health</option>
          </select>

          <select id="prioritySelect">
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
          </select>

          <input id="dueDateInput" type="date" />
          <button id="addTaskBtn" class="primary-btn">Add Task</button>
        </div>
      </section>

      <section class="toolbar">
        <div class="search-box">
          <input id="searchInput" type="text" placeholder="Search tasks..." />
        </div>

        <div class="filters" aria-label="Task filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
          <button class="filter-btn" data-filter="today">Today</button>
        </div>
      </section>

      <section class="progress-panel">
        <div class="progress-header">
          <span>Progress</span>
          <span id="progressText">0%</span>
        </div>
        <div class="progress-bar">
          <span id="progressBar"></span>
        </div>
      </section>

      <section id="taskList" class="task-list" aria-live="polite"></section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
